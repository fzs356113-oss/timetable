<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课表 · 2026-2027-1</title>
<meta name="theme-color" content="#1f6feb">
<meta name="description" content="个人课表，按周查看">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-row">
      <div class="brand">
        <span class="brand-name">课表</span>
        <span class="brand-sub">2026-2027-1</span>
      </div>
      <div class="weekbar">
        <button class="nav" id="prev" aria-label="上一周">‹</button>
        <div class="weeklabel" id="weeklabel">第 1 周</div>
        <button class="nav" id="next" aria-label="下一周">›</button>
      </div>
    </div>
    <div class="hdr-row2">
      <div class="next" id="hint">—</div>
      <button class="ghost" id="thisweek">本周</button>
    </div>
    <div class="setup" id="setup" hidden>
      <label for="startdate">设置第 1 周的周一</label>
      <input type="date" id="startdate">
      <button class="primary" id="saveStart">保存</button>
    </div>
  </header>

  <main class="views">
    <div class="board" id="board" aria-label="课程表网格"></div>
    <div class="daylist" id="list" aria-label="按天课表"></div>
  </main>

  <footer class="extras">
    <h2>其他课程</h2>
    <ul id="extralist"></ul>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
